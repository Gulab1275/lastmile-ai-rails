services:
  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    container_name: rahbar-api
    restart: always
    env_file:
      - ../.env
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
    expose:
      - "8000"
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')" ]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks:
      - rahbar-net

  caddy:
    image: caddy:2-alpine
    container_name: rahbar-caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    networks:
      - rahbar-net

networks:
  rahbar-net:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:

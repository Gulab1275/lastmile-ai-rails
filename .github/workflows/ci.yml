name: Rahbar Backend CI

on:
  push:
    branches: [ main, "feat/**" ]
  pull_request:
    branches: [ main ]

jobs:
  backend-quality:
    name: Lint & Pytest Suite
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Ruff Linter
      run: |
        ruff check services/ mock/ tests/

    - name: Run Pytest Suite
      env:
        APP_ENV: testing
        SECRET_KEY: test-secret-key-for-github-actions-ci-min32chars
        MOCK_CHAOS_MODE: none
        PYTHONPATH: .
      run: |
        pytest tests/ -v

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rahbar-api"
version = "1.0.0"
description = "Rahbar: AI-Powered Digital Public Infrastructure Rails for The Last Mile"
authors = [
    { name = "Mahandar Khatri", email = "mk6447959@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.6",
    "pydantic>=2.9.2",
    "pydantic-settings>=2.14.2",
    "pyjwt>=2.15.0",
    "argon2-cffi>=23.1.0",
    "slowapi>=0.1.10",
    "httpx>=0.27.0",
    "cryptography>=43.0.0",
]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [
    ".git",
    ".ruff_cache",
    ".pytest_cache",
    "venv",
    ".venv",
    "build",
    "dist",
    "apps/web",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
